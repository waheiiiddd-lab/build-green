name: Build GKI

on:
  workflow_call:
    inputs:
      KERNEL_NAME:
        type: string
        required: true

  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'gasak-mbud'
        required: false
        default: 'zixine-elysium-inline-3.5'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build zixine
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "zixine"
          git config --global user.email "waheiiiddd@gmail.com"

      - name: Install build tools
        run: sudo apt install -y git curl bc bison flex unzip zip repo rsync aria2 wget

      - name: Init & Sync GKI
        run: |
          mkdir gki && cd gki
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch -j$(nproc --all)

      - name: Setup Kernel Source
        run: |
          cd gki/common
          git remote add waheiiiddd-lab https://github.com/waheiiiddd-lab/Kolor-ijo.git
          git fetch -j12 waheiiiddd-lab
          git checkout -b update-anisphia waheiiiddd-lab/anisphia
          rm -rf drivers/staging/kernelsu

      - name: Setup ksu
        working-directory: gki/common
        run: |
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
            curl -LSs "https://raw.githubusercontent.com/pershoot/kernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
            git clone https://gitlab.com/simonpunk/susfs4ksu/ -b gki-android12-5.10 sus
            rm -rf sus/.git
            susfs=sus/kernel_patches
            cp -r $susfs/fs . && cp -r $susfs/include .
            cp -r $susfs/50_add_susfs_in_gki-android12-5.10.patch .
            patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch
            
            if [ -f "drivers/kernelsu/supercalls.c" ]; then
              sed -i 's/#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME/#if 0 \/\* CONFIG_KSU_SUSFS_SPOOF_UNAME Disabled to fix build \*\//' drivers/kernelsu/supercalls.c || true
              echo "SUSFS symbol fix applied for KernelSU-Next."
            else
              echo "Skipping obsolete SUSFS uname fix."
            fi

            if [ -f "drivers/kernelsu/ksu.c" ]; then
            sed -i '/^#if.*CONFIG_STACKPROTECTOR_PER_TASK/c\#if 0 \/\/ Disabled to fix duplicate symbol' drivers/kernelsu/ksu.c || true
            echo "Stack protector fix applied."
            else
            echo "Skipping obsolete stack protector fix (File not found in KernelSU-Next)."
            fi

            echo "Applying AVC spoof compatibility fix (ALL GKI)..."
            if [ -f "drivers/kernelsu/extras.c" ]; then
            EXTRAS_FIX_TMP="$WORKDIR/.extras_avc_fix_tmp"
            if grep -q "susfs_avc_log_spoofing_key_true" "drivers/kernelsu/extras.c"; then
            cat << 'AVC_STATIC_KEY_EOF' > "$EXTRAS_FIX_TMP"
            #ifdef CONFIG_KSU_SUSFS
            #ifndef susfs_avc_log_spoofing_key_true
            __attribute__((weak))
            struct static_key_true susfs_avc_log_spoofing_key_true = STATIC_KEY_TRUE_INIT;
            #endif
            #endif
            AVC_STATIC_KEY_EOF
                  echo "Detected Static Key pattern, applying weak definition fix..."
                elif grep -q "susfs_is_avc_log_spoofing_enabled" "drivers/kernelsu/extras.c"; then
                  cat << 'AVC_BOOL_EOF' > "$EXTRAS_FIX_TMP"
            #ifdef CONFIG_KSU_SUSFS
            #ifndef susfs_is_avc_log_spoofing_enabled
            __attribute__((weak))
            bool susfs_is_avc_log_spoofing_enabled = false;
            #endif
            #endif
            AVC_BOOL_EOF
                  echo "Detected Boolean pattern, applying weak definition fix..."
                else
                  echo "[INFO] No SUSFS AVC spoof symbols found in extras.c, skipping fix."
                  rm -f "$EXTRAS_FIX_TMP"
                  EXTRAS_FIX_TMP=""
                fi
                
                if [ -n "$EXTRAS_FIX_TMP" ] && [ -f "$EXTRAS_FIX_TMP" ]; then
                  if ! grep -q "__attribute__((weak))" "drivers/kernelsu/extras.c"; then
                    LAST_INCLUDE_LINE=$(grep -n '#include' "drivers/kernelsu/extras.c" | tail -1 | cut -d: -f1)
                    
                    if [ -n "$LAST_INCLUDE_LINE" ] && [ "$LAST_INCLUDE_LINE" -gt 0 ]; then
                      sed -i "${LAST_INCLUDE_LINE}r ${EXTRAS_FIX_TMP}" "drivers/kernelsu/extras.c"
                      echo "[SUCCESS] AVC spoof fix injected into extras.c."
                    else
                      cat "$EXTRAS_FIX_TMP" "drivers/kernelsu/extras.c" > "drivers/kernelsu/extras.c.tmp"
                      mv "drivers/kernelsu/extras.c.tmp" "drivers/kernelsu/extras.c"
                      echo "[SUCCESS] AVC spoof fix prepended to extras.c."
                    fi
                  else
                    echo "[INFO] AVC spoof fix already present in extras.c."
                  fi
                  
                  rm -f "$EXTRAS_FIX_TMP"
                fi
              else
                echo "[WARNING] drivers/kernelsu/extras.c not found! Skipping AVC spoof fix."
              fi
            
            echo "Patch All Managers Support..."
            curl -LSs "https://raw.githubusercontent.com/Kingfinik98/gki-builder/refs/heads/6.x/kernel-patches/ksu/ksun-add-more-managers-support.patch" -o /tmp/ksun-add-more-managers-support.patch
            cd KernelSU-Next && patch -p1 < /tmp/ksun-add-more-managers-support.patch && cd ..
            

      - name: Remove check_defconfig
        run: |
          sed -i 's/check_defconfig//' gki/common/build.config.gki
          
          DEFCONFIG="arch/arm64/configs/gki_defconfig" 
          echo "⚙️ Added KSU & SuSFS configuration"
          cat >> $DEFCONFIG <<EOF
          CONFIG_KSU=y
          CONFIG_KPM=n
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          EOF
          echo "🔧 Mode: SuSFS Hook Enabled"
          cat >> $DEFCONFIG <<EOF
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT_SPOOF_GENERIC=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_TRY_UMOUNT=n
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=n
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_MANUAL_HOOK=n
          CONFIG_KSU_HAS_MANUAL_HOOK=n
          EOF
          
          echo "⚙️ Adding Universal Performance Tuning"
          cat >> $DEFCONFIG <<EOF
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_WESTWOOD=y
          # CONFIG_TCP_CONG_BBR is not set
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_NET_SCH_FQ=y
          # CONFIG_IOSCHED_BFQ is not set
          # CONFIG_BFQ_GROUP_IOSCHED is not set
          CONFIG_DEFAULT_ADIOS=y
          CONFIG_MQ_IOSCHED_ADIOS=y
          CONFIG_DEFAULT_ADIOS=y
          CONFIG_MQ_DEADLINE=y
          CONFIG_DEFAULT_MQ_DEADLINE=y
          # CONFIG_DEFAULT_FQ_CODEL is not set
          CONFIG_HZ_300=y
          CONFIG_HZ=300
          CONFIG_CPU_FREQ=y
          CONFIG_SWAP=y
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
          CONFIG_CPU_FREQ_GOV_ONDEMAND=y
          EOF

      - name: Patch DRM Xiaomi
        working-directory: gki/common
        run: |
          sed -i '/pr_warn.*disagrees about version of symbol.*/,+1 s/.*/return 1;/' kernel/module.c
          sed -i '/^static int drm_atomic_check_valid_clones/,/^}/d' drivers/gpu/drm/drm_atomic_helper.c
          sed -i '/ret = drm_atomic_check_valid_clones/,/return ret;/d' drivers/gpu/drm/drm_atomic_helper.c
      
      - name: Set version
        working-directory: gki/common
        run: |
          echo "" > scripts/setlocalversion
          chmod +x scripts/setlocalversion

          if grep -q '^EXTRAVERSION *=' Makefile; then
            sed -i "s/^EXTRAVERSION *=.*/EXTRAVERSION/" Makefile
          else
            echo "EXTRAVERSION" >> Makefile
          fi

      - name: Setup Toolchain
        working-directory: gki
        run: |
          mkdir -p prebuilts-master/clang/host/linux-x86
          CLANG_VER="clang-r547379"
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/62cdcefa89e31af2d72c366e8b5ef8db84caea62/clang-r547379.tar.gz"
          echo "CLANG_VER=$CLANG_VER" >> $GITHUB_ENV
          mkdir -p prebuilts-master/clang/host/linux-x86/$CLANG_VER
          cd prebuilts-master/clang/host/linux-x86

          curl -L "${CLANG_URL}" -o clang-temp.tar.gz
          tar -xzf clang-temp.tar.gz -C $CLANG_VER
          
          rm -f clang-temp.tar.gz
          
          rm -rf clang-r563880b
          ln -sf $CLANG_VER clang-r563880b
      
      - name: Commit changes
        working-directory: gki/common
        run: |
          git add .
          git commit -m "Final clean tree before build" || true

      - name: Compile
        working-directory: gki
        run: |
          KBUILD_BUILD_USER="zixine" KBUILD_BUILD_HOST="aitt"
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh -j$(nproc --all)

      - name: Package Kernel
        run: |
          mkdir -p artifacts

          VERSION=$(make -s kernelversion -C gki/common)

          BUILD_DATE=$(date +"%Y%m%d")
          BASE="AK3-${VERSION}-+${BUILD_DATE}"
          echo "BASE=$BASE" >> $GITHUB_ENV
          ZIP_NAME="${BASE}.zip"

          git clone -q --depth=1 https://github.com/waheiiiddd-lab/anykernel3
          cp gki/out/android12-5.10/dist/Image anykernel/

          cd anykernel
          zip -r9 "../artifacts/$ZIP_NAME" ./*

          cd ..

          # info.txt
          cat <<EOF > artifacts/info.txt
          KERNEL_NAME=$BASE
          KVER=$VERSION
          DATE=$BUILD_DATE
          EOF
      
      - name: Upload AnyKernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASE }}-${{ github.run_number }}
          path: artifacts/*.zip

      - name: Upload Info.txt artifact
        uses: actions/upload-artifact@v4
        with:
         name: info-${{ github.run_number }}
         path: artifacts/*.txt
